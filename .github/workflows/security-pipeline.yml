name: DevSecOps Security Pipeline

# Critério do Security Gate (justificativa completa em docs/relatorio_final_capstone_ex12_ex13.md, seção 1.3):
#   BLOQUEIA o merge se QUALQUER uma das condições abaixo ocorrer:
#     1. SCA   - pip-audit encontra vulnerabilidade conhecida em dependência (a ferramenta não expõe CVSS,
#                então o critério é conservador: qualquer CVE bloqueia; exceção só via --ignore-vuln justificado).
#     2. SAST  - Bandit encontra achado de severidade MÉDIA ou ALTA (bandit -ll; Low é apenas registrado).
#     3. Testes - qualquer falha no pytest (inclui os testes de regressão de autorização, que cobrem todas as
#                vulnerabilidades com CVSS >= 7.0 levantadas no Assessment).
#   O bloqueio do MERGE depende de branch protection exigindo o check "Security Gate" (ver README, seção CI).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Novas CVEs surgem depois do merge: reexecuta o gate semanalmente (segunda, 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores APENAS de teste (nenhum segredo real). Em produção vêm de cofre/ambiente.
      SECRET_KEY: "ci-only-secret-key-not-for-production-0123456789abcdef"
      DATABASE_URL: "sqlite:///./ci_test.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Stage 1 - SCA (pip-audit) - bloqueia qualquer CVE conhecido
        run: pip-audit -r requirements.txt --strict

      - name: Stage 2 - SAST (Bandit) - bloqueia severidade MEDIUM ou HIGH
        run: bandit -r app/ -ll -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Stage 3 - Testes automatizados de segurança (pytest) - qualquer falha bloqueia
        run: pytest -v
